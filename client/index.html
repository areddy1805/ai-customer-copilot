<!doctype html>
<html>
  <head>
    <link rel="icon" href="favicon.ico" />
    <title>AI Customer Copilot</title>

    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
        background: #020617;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 100%;
        max-width: 820px;
        height: 92vh;
        display: flex;
        flex-direction: column;
        background: #020617;
        border: 1px solid #1e293b;
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      }

      .header {
        padding: 16px 20px;
        font-weight: 600;
        font-size: 16px;
        border-bottom: 1px solid #1e293b;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .header span {
        color: #94a3b8;
        font-size: 13px;
      }

      .chat {
        flex: 1;
        overflow-y: auto;
        padding: 24px;
        display: flex;
        flex-direction: column;
      }

      .msg {
        max-width: 70%;
        padding: 12px 14px;
        margin-bottom: 14px;
        border-radius: 12px;
        line-height: 1.5;
        font-size: 14px;
        white-space: pre-wrap;
      }

      .user {
        background: #2563eb;
        margin-left: auto;
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
      }

      .bot {
        background: #1e293b;
      }

      .input-area {
        display: flex;
        padding: 14px;
        border-top: 1px solid #1e293b;
        background: #020617;
      }

      input {
        flex: 1;
        padding: 12px;
        border-radius: 8px;
        border: 1px solid #1e293b;
        background: #020617;
        color: white;
        font-size: 14px;
      }

      input::placeholder {
        color: #64748b;
      }

      input:focus {
        border-color: #2563eb;
        outline: none;
      }

      button {
        margin-left: 10px;
        padding: 12px 18px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: 500;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        background: #334155;
        cursor: not-allowed;
      }

      .empty {
        text-align: center;
        color: #64748b;
        margin-top: 60px;
        font-size: 14px;
      }

      .typing {
        font-style: italic;
        color: #94a3b8;
      }

      .footer {
        text-align: center;
        font-size: 11px;
        color: #475569;
        padding: 6px;
        border-top: 1px solid #1e293b;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div>AI Customer Copilot</div>
        <span>LLM Orchestrator Demo</span>
      </div>

      <div id="chat" class="chat">
        <div class="empty">Ask about orders, refunds, or delivery issues</div>
      </div>

      <div class="input-area">
        <input id="input" placeholder="Type your message..." />
        <button id="sendBtn" onclick="send()">Send</button>
      </div>

      <div class="footer">Streaming · Tool Orchestration · RAG Enabled</div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
